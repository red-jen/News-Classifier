dataset:
  name: "your_dataset_name"  # Replace with the actual dataset name from Hugging Face
  split: "train"  # Specify the split of the dataset to load (e.g., train, test, validation)

model:
  type: "your_model_type"  # Specify the type of model to use (e.g., 'bert', 'logistic_regression')
  parameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 10

preprocessing:
  remove_duplicates: true
  remove_stopwords: true
  normalize_text: true
  punctuation_removal: true

eda:
  visualize: true
  summary_statistics: true

logging:
  level: "INFO"  # Set the logging level (e.g., DEBUG, INFO, WARNING, ERROR)
  log_file: "logs/project.log"  # Specify the log file path

output:
  results_dir: "results/"  # Directory to save results and models
  model_save_path: "models/best_model.pth"  # Path to save the trained model